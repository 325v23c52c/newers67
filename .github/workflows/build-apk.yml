name: Збірка APK для Android 9 та 13 (32 та 64 біти)

on:
  workflow_dispatch: # Запуск вручну по кнопці

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Отримання коду
        uses: actions/checkout@v4

      - name: Налаштування Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Встановлення системних залежностей
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Встановлення Buildozer та Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Компіляція APK (Android 9 + 13, armeabi-v7a + arm64-v8a)
        run: |
          buildozer android debug

      - name: Збереження готового APK файлу
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-Android-9-13-APK
          path: bin/*.apk
