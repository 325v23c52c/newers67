name: Збірка APK для Android 9 та 13

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Отримання вихідного коду
        uses: actions/checkout@v4

      - name: Компіляція APK через офіційний Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Завантаження готового APK
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-Android-APK
          path: bin/*.apk
