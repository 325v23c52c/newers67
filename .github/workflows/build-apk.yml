name: Збірка APK для Android 9 та 13

on:
  workflow_dispatch: # Запуск вручну по кнопці
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Отримання вихідного коду (main.py та buildozer.spec)
        uses: actions/checkout@v4

      # Офіційний контейнер Buildozer Action з встановленими SDK/NDK
      - name: Компіляція APK через Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      # Збереження готового .apk файлу в артефакти
      - name: Завантаження готового APK
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-Android-APK
          path: bin/*.apk
